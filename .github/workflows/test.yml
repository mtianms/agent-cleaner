name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o agent-cleaner.exe .
      - uses: actions/upload-artifact@v7
        with:
          name: agent-cleaner-windows-amd64
          path: agent-cleaner.exe
          if-no-files-found: error
